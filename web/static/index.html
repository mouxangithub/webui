<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openpilot</title>
  <link rel="stylesheet" href="/static/css/opui.css" />
</head>
<body>
  <div id="opui-viewport">
  <div id="app" class="opui" data-screen="home">
    <!-- Offroad / settings sidebar (left 500px when settings) -->
    <aside id="settings-sidebar" class="opui-sidebar" hidden>
      <nav class="opui-nav" id="nav"></nav>
      <button type="button" id="btn-close-settings" class="opui-close" aria-label="Close">×</button>
    </aside>

    <!-- Metrics sidebar (300px) — offroad home + onroad -->
    <aside id="metrics-sidebar" class="opui-metrics-sidebar">
      <button type="button" id="btn-sidebar-settings" class="opui-sidebar-btn opui-sidebar-btn--settings" title="设置"></button>
      <div id="sidebar-network" class="opui-sidebar-network">
        <div class="opui-net-dots"></div>
        <div class="opui-net-type">Wi-Fi</div>
      </div>
      <div id="metrics" class="opui-side-metrics"></div>
      <button type="button" id="btn-sidebar-bottom" class="opui-sidebar-btn opui-sidebar-btn--home" title=""></button>
    </aside>

    <main id="main" class="opui-main">
      <!-- HOME (offroad) -->
      <section id="screen-home" class="opui-screen opui-screen--home">
        <header class="opui-home-header">
          <div id="home-version" class="opui-home-version"></div>
        </header>
        <div class="opui-home-content">
          <div class="opui-home-col opui-home-col--left">
            <div id="home-prime" class="opui-home-prime-wrap"></div>
          </div>
          <div class="opui-home-col opui-home-col--right">
            <button type="button" id="home-exp-banner" class="opui-home-exp" hidden>
              <span class="opui-home-exp-icon">⚛</span>
              <span>实验模式已开启</span>
            </button>
            <div id="home-setup" class="opui-home-setup-wrap"></div>
          </div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="screen-settings" class="opui-screen" hidden>
        <header class="opui-panel-header">
          <h2 id="panel-title">Settings</h2>
        </header>
        <div id="panel-content" class="opui-panel"></div>
      </section>

      <!-- ONROAD -->
      <section id="screen-onroad" class="opui-screen opui-screen--onroad" hidden>
        <div id="camera-wrap" class="opui-camera-wrap">
          <video id="road-video" class="opui-camera-video" autoplay playsinline muted></video>
          <div id="camera-fallback" class="opui-camera-fallback">
            <p>相机加载中…</p>
            <button type="button" id="btn-start-stream" class="opui-btn">启动 WebRTC 流</button>
          </div>
        </div>
        <div id="model-overlay" class="opui-model-overlay" hidden></div>
        <div id="hud" class="opui-hud">
        <div class="opui-hud-gradient" aria-hidden="true"></div>
        <div id="hud-set-speed" class="opui-hud-cruise" hidden>
          <div class="opui-hud-cruise-max">MAX</div>
          <div id="set-speed-val" class="opui-hud-cruise-val">–</div>
        </div>
        <div id="hud-speed-limit-wrap" class="opui-hud-sla" hidden>
          <span id="hud-speed-limit"></span>
        </div>
        <div id="hud-road-name" class="opui-hud-road" hidden></div>
        <div id="hud-blinker-l" class="opui-blinker opui-blinker--l" hidden>◀</div>
        <div id="hud-blinker-r" class="opui-blinker opui-blinker--r" hidden>▶</div>
        <div id="hud-bsl" class="opui-bsl opui-bsl--l" hidden></div>
        <div id="hud-bsr" class="opui-bsl opui-bsl--r" hidden></div>
        <svg id="dm-arc" class="opui-dm-arc" viewBox="0 0 120 120" hidden>
          <circle class="dm-arc-bg" cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
          <circle class="dm-arc-fill" cx="60" cy="60" r="50" fill="none" stroke="#80d8a6" stroke-width="8"
            stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="0 220"/>
          <circle class="dm-arc-h" cx="60" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4"
            stroke-linecap="round" transform="rotate(0 60 60)" stroke-dasharray="0 220"/>
          <circle class="dm-arc-v" cx="60" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4"
            stroke-linecap="round" transform="rotate(90 60 60)" stroke-dasharray="0 220"/>
        </svg>
        <div id="hud-standstill" class="opui-hud-standstill" hidden>
          <div class="opui-hud-standstill-label">STOPPED</div>
          <div id="hud-standstill-timer" class="opui-hud-standstill-timer">0:00</div>
        </div>
        <div class="opui-hud-speed-block">
          <span id="hud-speed">0</span>
          <span id="hud-unit" class="opui-hud-unit">km/h</span>
        </div>
        <button type="button" id="btn-experimental" class="opui-exp-btn" hidden title="Experimental">α</button>
        </div>
        <div id="alert-bar" class="opui-alert" hidden>
          <span id="alert-text1"></span>
          <span id="alert-text2" class="opui-alert-sub"></span>
        </div>
      </section>
    </main>

    <div id="border" class="opui-border opui-border--disengaged"></div>
    <div id="toast" class="opui-toast" hidden></div>
    <dialog id="confirm-dialog" class="opui-dialog">
      <p id="confirm-msg"></p>
      <div class="opui-dialog-actions">
        <button type="button" id="confirm-cancel" class="opui-btn">取消</button>
        <button type="button" id="confirm-ok" class="opui-btn opui-btn--primary">确认</button>
      </div>
    </dialog>

    <div id="modal-confirm" class="opui-modal" hidden>
      <div class="opui-modal-card">
        <div id="modal-confirm-msg" class="opui-modal-body"></div>
        <div class="opui-modal-actions">
          <button type="button" id="modal-confirm-cancel" class="opui-btn">Cancel</button>
          <button type="button" id="modal-confirm-ok" class="opui-btn opui-btn--primary">Confirm</button>
        </div>
      </div>
    </div>

    <div id="modal-keyboard" class="opui-modal opui-modal--keyboard" hidden>
      <div class="opui-modal-card opui-keyboard-card">
        <div id="keyboard-title" class="opui-modal-title"></div>
        <div id="keyboard-display" class="opui-keyboard-display"></div>
        <div id="keyboard-grid" class="opui-keyboard-grid"></div>
        <button type="button" id="keyboard-cancel" class="opui-btn">Cancel</button>
      </div>
    </div>

    <div id="modal-tree" class="opui-modal" hidden>
      <div class="opui-modal-card opui-tree-card">
        <div id="tree-title" class="opui-modal-title"></div>
        <div id="tree-search-wrap"><input id="tree-search" class="opui-input" placeholder="Search…" /></div>
        <div id="tree-body" class="opui-tree-body"></div>
        <div class="opui-modal-actions">
          <button type="button" id="tree-cancel" class="opui-btn">Cancel</button>
          <button type="button" id="tree-select" class="opui-btn opui-btn--primary">Select</button>
        </div>
      </div>
    </div>

    <div id="modal-multi" class="opui-modal" hidden>
      <div class="opui-modal-card">
        <div id="multi-title" class="opui-modal-title"></div>
        <div id="multi-list" class="opui-multi-list"></div>
        <button type="button" id="multi-cancel" class="opui-btn">Cancel</button>
      </div>
    </div>

    <div id="modal-html" class="opui-modal" hidden>
      <div class="opui-modal-card opui-html-card">
        <div id="html-title" class="opui-modal-title"></div>
        <div id="html-body" class="opui-html-scroll"></div>
        <button type="button" id="html-ok" class="opui-btn opui-btn--primary">OK</button>
      </div>
    </div>

    <dialog id="driver-camera-dialog" class="opui-dialog opui-driver-cam">
      <h3>Driver Camera</h3>
      <video id="driver-video" autoplay playsinline muted></video>
      <button type="button" id="driver-cam-close" class="opui-btn">Close</button>
    </dialog>
  </div>
  </div>

  <!-- PC dev simulation — outside scaled viewport -->
  <aside id="dev-panel" class="opui-dev-panel" hidden>
    <div class="opui-dev-title">PC Dev 模拟</div>
    <div class="opui-dev-presets">
      <button type="button" data-preset="home">离路</button>
      <button type="button" data-preset="onroad_engaged">行驶·激活</button>
      <button type="button" data-preset="onroad_disengaged">行驶·未激活</button>
      <button type="button" data-preset="override">Override</button>
      <button type="button" data-preset="lat_only">仅横向</button>
      <button type="button" data-preset="alert_critical">严重告警</button>
    </div>
    <label class="opui-dev-row"><input type="checkbox" id="dev-started" /> 已上路 (started)</label>
    <label class="opui-dev-row"><input type="checkbox" id="dev-engaged" /> 已激活 (engaged)</label>
    <label class="opui-dev-row"><input type="checkbox" id="dev-experimental" /> Experimental</label>
    <label class="opui-dev-row">车速 <input type="range" id="dev-speed" min="0" max="150" value="72" /> <span id="dev-speed-val">72</span></label>
  </aside>
  <script type="module" src="/static/js/app.js?v=4"></script>
</body>
</html>
